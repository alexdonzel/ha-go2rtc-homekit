name: Build for the latest Home Assistant release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["patches/**", "extras/**", "tools/**", "testbuild.json", ".github/workflows/build.yml", "go2rtc.ref"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, to number builds

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install translation script dependencies
        run: pip install orjson voluptuous

      - name: Find the latest Home Assistant release
        id: release
        run: |
          tag=$(gh release view --repo home-assistant/core --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: |
          tag=${{ steps.release.outputs.tag }}
          last=$(git tag --list "$tag.*" --sort=-v:refname | head -n1)
          build=$(( ${last##*.} + 1 ))
          # A tag left without a release, e.g. when creating it failed, is
          # built and released again
          if [ -n "$last" ] && ! gh release view "$last" > /dev/null 2>&1; then
            echo "Releasing $last, which has no release"
            build=${last##*.}
            echo "rerelease=true" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$last" >> "$GITHUB_OUTPUT"
            python3 tools/build.py --tag "$tag" --build "$build"
            cp go2rtc.ref custom_components/go2rtc/go2rtc.ref
            exit 0
          fi
          python3 tools/build.py --tag "$tag" --build "$build"
          # Record the go2rtc build, so a change to it counts as a change
          cp go2rtc.ref custom_components/go2rtc/go2rtc.ref
          git add --intent-to-add custom_components
          # Compare with the last release, ignoring the version bump itself
          if [ -n "$last" ] \
              && git diff --quiet -I '"version":' "$last" -- custom_components hacs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$tag.$build" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the build compiles
        if: steps.build.outputs.changed == 'true'
        run: python3 -m compileall -q custom_components

      - name: Build go2rtc
        if: steps.build.outputs.changed == 'true'
        run: |
          read -r repo ref < go2rtc.ref
          git clone --quiet --filter=blob:none "https://github.com/$repo" build/go2rtc
          git -C build/go2rtc checkout --quiet "$ref"
          for target in x86_64:amd64 aarch64:arm64; do
            machine=${target%%:*} goarch=${target##*:}
            (cd build/go2rtc && CGO_ENABLED=0 GOOS=linux GOARCH=$goarch \
              go build -ldflags "-s -w" -trimpath -o "../bin/$machine/go2rtc")
          done
          ./build/bin/x86_64/go2rtc -version

      - name: Package
        if: steps.build.outputs.changed == 'true'
        run: |
          mkdir -p dist/pkg
          cp -r custom_components/go2rtc/. dist/pkg/
          cp -r build/bin dist/pkg/bin
          cp build/go2rtc/LICENSE dist/pkg/bin/LICENSE-go2rtc
          (cd dist/pkg && zip -qr ../go2rtc.zip . -x '*__pycache__*')
          ls -l dist/go2rtc.zip

      - name: Commit and release
        if: steps.build.outputs.changed == 'true'
        run: |
          version=${{ steps.build.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.build.outputs.rerelease }}" != "true" ]; then
            git add custom_components hacs.json
            git commit -m "Build $version for Home Assistant ${{ steps.release.outputs.tag }}"
            git tag "$version"
            git push --atomic origin HEAD "$version"
          fi
          gh release create "$version" --title "$version" \
            --notes "Test build for Home Assistant ${{ steps.release.outputs.tag }}, with go2rtc from $(cat go2rtc.ref)." \
            dist/go2rtc.zip
